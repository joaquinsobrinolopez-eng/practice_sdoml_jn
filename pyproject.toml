[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "practice-sdoml-joaquin"
version = "0.1.4"
description = "Interactive ML demo for diabetes risk classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0",
    "torch>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[tool.ruff]
line-length = 99
src = ["practice_sdoml"]
include = ["pyproject.toml", "practice_sdoml/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["practice_sdoml"]
force-sort-within-sections = true

[project.scripts]
practice-sdoml-joaquin = "practice_sdoml.app:demo.launch"
practice-demo = "practice_sdoml.app:demo.launch"

[tool.flit.module]
name = "practice_sdoml"