[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "practice_sdoml"
version = "0.0.1"
description = "Project structure, training and visualization"
authors = [
  { name = "Joaquuin" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10.0"
dependencies = [
    "loguru~=0.7",
    "matplotlib~=3.7",
    "numpy~=1.24",
    "pandas~=2.0",
    "python-dotenv~=1.0",
    "scikit-learn~=1.3",
    "seaborn~=0.12",
    "sphinx~=7.0",
    "sphinx-rtd-theme~=2.0",
    "torch~=2.0",
    "tqdm~=4.66",
    "typer>=0.27.2",
]


[tool.ruff]
line-length = 99
src = ["practice_sdoml"]
include = ["pyproject.toml", "practice_sdoml/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["practice_sdoml"]
force-sort-within-sections = true

